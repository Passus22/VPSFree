name: RDP_TIPSUNIX

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest

    steps:
    - name: Set up job
      run: echo "Starting setup..."

    - name: Configure Core RDP Settings
      run: |
        sudo apt-get update
        sudo apt-get install -y xrdp xfce4 xfce4-goodies

    - name: Create RDP User with Secure Password
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo "rdpuser:Password123!" | sudo chpasswd
        sudo usermod -aG sudo rdpuser
        echo "XFCE" > ~/.xinitrc

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Establish Tailscale Connection
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-vps --ssh

    - name: Verify RDP Accessibility
      run: |
        echo "Tailscale connected successfully. IP Address:"
        tailscale ip -4

    - name: Maintain Connection
      run: |
        sleep 21600

    - name: Complete job
      run: echo "Job finished."
