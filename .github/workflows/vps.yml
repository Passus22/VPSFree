name: RDP_TIPSUNIX

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: ubuntu-latest

    steps:
    - name: Set up job
      run: echo "Starting setup..."

    - name: Configure Core RDP Settings
      run: |
        sudo apt-get update
        sudo apt-get install -y xrdp xfce4 xfce4-goodies

    - name: Create RDP User with Secure Password
      run: |
        sudo useradd -m -s /bin/bash rdpuser
        echo "rdpuser:Password123!" | sudo chpasswd
        sudo usermod -aG sudo rdpuser
        echo "XFCE" > ~/.xinitrc

    - name: Install Tailscale
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh

    - name: Establish Tailscale Connection
      run: |
        sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTHKEY }} --hostname=github-vps --ssh

    - name: Verify RDP Accessibility
      run: |
        echo "Tailscale connected successfully. IP Address:"
        tailscale ip -4

    - name: Maintain Connection
      run: |
        # Menjaga agar GitHub Actions tetap aktif (maksimal sekitar 6 jam)
        sleep 21600

    - name: Complete job
      run: echo "Job finished."
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "http://www.youtube.com/@TipsUNIX"
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "Password: $(echo $env:RDP_CREDS)"
          Write-Host "==================`n"
          
          # Keep runner active indefinitely (or until manually cancelled)
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
              Start-Sleep -Seconds 300
          }
